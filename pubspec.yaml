name: flutter_application_1
description: "Battery Monitoring & Asset Management System"
publish_to: 'none'
version: 1.1.0+2

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Navigation
  go_router: ^14.8.1

  # Local Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Bluetooth Classic (SPP)
  flutter_bluetooth_serial_plus: ^0.5.6

  # WiFi / HTTP (for ESP32 AP mode)
  http: ^1.3.0

  # QR / Barcode Scanning
  mobile_scanner: ^7.4.1

  # Charts
  fl_chart: ^0.70.2

  # Excel Report Generation
  excel: ^4.0.6

  # PDF Report Generation
  pdf: ^3.11.3
  printing: ^5.14.2

  # Date/Time Formatting
  intl: ^0.20.2

  # UUID Generation
  uuid: ^4.5.1

  # Runtime Permissions
  permission_handler: ^11.4.0

  # File System
  path_provider: ^2.1.5

  # Share Files
  share_plus: ^10.1.4

  # Google Fonts
  google_fonts: ^6.2.1
  wifi_iot: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
